<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="robots" content="noindex">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="img/icone-192.png">
  <link rel="apple-touch-icon" href="img/icone-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="painel">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div class="app">

      <div class="marca">
        <img src="img/icone-192.png" alt="" width="36" height="36">
        <div>
          <strong id="nome-negocio-menu">Geladinho Fácil</strong>
          <small>Painel da produtora</small>
        </div>
      </div>
      <nav>
        <ul id="menu-lateral-lista"></ul>
      </nav>
      <a class="link-cardapio" href="index.html" target="_blank">Ver cardápio do cliente</a>
    </aside>

    <div class="principal">
      <header class="topo-painel">
        <h1 id="titulo-tela">Início</h1>
        <span class="selo-demo" id="selo-demo" hidden>Dados de demonstração</span>
      </header>
      <main id="conteudo" tabindex="-1">
        <p class="vazio">Carregando...</p>
      </main>
    </div>
  </div>

  <nav class="menu-inferior" id="menu-inferior" aria-label="Menu"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
